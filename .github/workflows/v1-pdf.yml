name: V1.0 formal PDF export
on:
  push:
    branches: [exports/v1-formal-pdf-20261126]
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Export complete dashboard
        run: |
          python3 -m http.server 8787 >/tmp/http.log 2>&1 &
          node export_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: v1-formal-pdf
          path: exports/
