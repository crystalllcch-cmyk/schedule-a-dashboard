name: V1.4 analysis revision acceptance
on:
  push:
    branches: [work/v14-analysis-20261127]
permissions:
  contents: write
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build and verify
        run: |
          python3 -m http.server 8787 >/tmp/http.log 2>&1 &
          node build_v14.cjs
          node advanced/qa_v14.cjs
      - name: Persist validated V1.4 HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advanced/index.html versions/v1.4/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Bake validated V1.4 static and interactive report"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-specified-copy
          path: |
            exports/
            advanced/qa-results/
