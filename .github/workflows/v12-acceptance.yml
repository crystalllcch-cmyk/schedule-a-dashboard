name: V1.2 analysis rewrite acceptance
on:
  push:
    branches: [work/v12-copy-rewrite-20261127]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build readable source and verify research preservation
        run: |
          python3 -m http.server 8787 >/tmp/http.log 2>&1 &
          node build_v12.cjs
          node advanced/qa_v12.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-analysis-acceptance
          path: |
            exports/
            advanced/qa-results/
