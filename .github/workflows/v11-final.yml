name: V1.1 final review acceptance
on:
  push:
    branches: [work/v11-review-fixes-20261127]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Bake current HTML and run acceptance
        run: |
          git show 4af3765bd4986d301c4880cb1f34e563dcced60d:advanced/index.html > original_v10.html
          python3 -m http.server 8787 >/tmp/http.log 2>&1 &
          node build_v11.cjs
          node advanced/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-final-acceptance
          path: |
            exports/
            advanced/qa-results/
